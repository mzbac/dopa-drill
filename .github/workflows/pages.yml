name: Test and deploy English iPad game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Rust WebAssembly engine
        run: |
          rustup target add wasm32-unknown-unknown
          bash tools/build-wasm.sh
      - name: Run correctness tests
        run: node --test tests/*.test.mjs
      - name: Prepare offline cache
        run: node tools/build-pwa.mjs
      - name: Validate published assets
        run: node tools/check-assets.mjs
      - name: Install browser test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test touch gameplay and offline mode
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-screenshots
          path: qa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
